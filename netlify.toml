"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  publish = "dist"
  command = "bun run build"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
